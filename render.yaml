services:
  - type: web
    name: autoverse-ml
    runtime: python
    plan: free
    rootDir: ml
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4

  - type: web
    name: autoverse-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Signs session tokens. Generated once by Render rather than committed,
      # and the API refuses to boot in production without it.
      - key: JWT_SECRET
        generateValue: true
      # Set this to an Atlas connection string to turn on accounts and saving.
      - key: MONGO_URI
        sync: false
      - key: ML_API_HOSTPORT
        fromService:
          type: web
          name: autoverse-ml
          property: hostport
